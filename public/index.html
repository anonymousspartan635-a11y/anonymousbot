<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANONYMOUS BOT - WhatsApp Deployer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #1e293b; border-radius: 16px; padding: 35px; width: 100%; max-width: 420px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; }
    h1 { font-size: 24px; color: #38bdf8; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    label { font-size: 12px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 14px; margin-top: 6px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; background: #22c55e; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #16a34a; }
    .status-box { margin-top: 20px; font-size: 14px; color: #e2e8f0; min-height: 20px; }
    .code-display { margin-top: 15px; font-size: 28px; font-weight: bold; letter-spacing: 6px; color: #38bdf8; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px dashed #38bdf8; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>ANONYMOUS BOT</h1>
    <p>Deploy your bot in seconds with Pairing Code</p>

    <div class="input-group">
      <label for="phoneNumber">WhatsApp Phone Number</label>
      <input type="text" id="phoneNumber" placeholder="e.g. 233540000000" />
    </div>

    <button onclick="deployBot()">Get Pairing Code</button>

    <div id="status" class="status-box"></div>
    <div id="codeDisplay" class="code-display"></div>
  </div>

  <script>
    const socket = io();
    let currentSessionId = null;

    async function deployBot() {
      const phone = document.getElementById('phoneNumber').value.trim();
      const statusBox = document.getElementById('status');
      const codeDisplay = document.getElementById('codeDisplay');

      if (!phone) {
        statusBox.innerText = '⚠️ Please enter a valid phone number.';
        return;
      }

      statusBox.innerText = '🔄 Requesting pairing code...';
      codeDisplay.style.display = 'none';

      try {
        const res = await fetch('/api/deploy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: phone })
        });

        const data = await res.json();
        if (data.sessionId) {
          currentSessionId = data.sessionId;
        } else {
          statusBox.innerText = '❌ Failed to initiate session.';
        }
      } catch (err) {
        statusBox.innerText = '❌ Server error. Try again.';
      }
    }

    socket.on('pairingCode', (data) => {
      if (data.sessionId === currentSessionId) {
        document.getElementById('status').innerText = '✅ Enter this code on WhatsApp:';
        const codeDisplay = document.getElementById('codeDisplay');
        codeDisplay.innerText = data.code;
        codeDisplay.style.display = 'block';
      }
    });

    socket.on('statusUpdate', (data) => {
      if (data.sessionId === currentSessionId) {
        document.getElementById('status').innerText = 'Status: ' + data.status;
      }
    });

    socket.on('botError', (data) => {
      if (data.sessionId === currentSessionId) {
        document.getElementById('status').innerText = '❌ ' + data.message;
      }
    });
  </script>
</body>
</html>
